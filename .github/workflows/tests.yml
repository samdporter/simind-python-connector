name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint and format check with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run CI-friendly tests
        run: |
          python -m pytest -c pytest-ci.ini -v --cov=simind_python_connector --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: |
          python -m build
      - name: Check package
        run: |
          twine check dist/*
      - name: Smoke-test wheel resources
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl
          /tmp/wheel-env/bin/python -c 'from simind_python_connector.configs import get; assert get("input.smc").is_file()'
          /tmp/wheel-env/bin/python -c 'from simind_python_connector.data import data_path; assert data_path("h2o.atn").is_file()'

  container-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core container validation
        run: bash scripts/run_container_validation.sh --only-core

      - name: Core container examples (SIMIND optional)
        run: bash scripts/run_container_examples.sh --only-core || echo "::warning::Core examples require SIMIND; skipped."

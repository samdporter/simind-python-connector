name: Tests

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main, develop, "release/**" ]
  workflow_call:
    inputs:
      ref:
        description: Ref (for example a release tag) to check out and test
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint and format check with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Check gallery outputs are current
        run: python scripts/check_gallery_current.py
      - name: Run CI-friendly tests
        run: |
          python -m pytest -m "not integration and not requires_sirf and not requires_stir and not requires_simind and not requires_pytomography and not requires_cil and not ci_skip and not validation and not macos_v9" --cov=simind_python_connector --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: |
          python -m build
      - name: Check package
        run: |
          twine check dist/*
      - name: Smoke-test wheel resources outside the checkout
        run: |
          repo="$GITHUB_WORKSPACE"
          venv="$(mktemp -d)/wheel-env"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet dist/*.whl
          workdir="$(mktemp -d)"
          cd "$workdir"
          "$venv/bin/python" "$repo/scripts/check_wheel_resources.py" --repo "$repo"

  container-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Core container validation
        run: bash scripts/run_container_validation.sh --only-core

      - name: Core container examples (SIMIND optional)
        run: bash scripts/run_container_examples.sh --only-core

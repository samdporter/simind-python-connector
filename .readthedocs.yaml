version: 2

build:
  os: ubuntu-22.04         
  tools:
    python: "3.10"        

sphinx:
  configuration: docs/conf.py
  # Fail the public deployment on any warning (including a duplicate object
  # description) so it matches the docs job in .github/workflows/docs.yml.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

  scoring_routine: 4
  collimator_routine: 1
  photon_direction: 3
  crystal_thickness: 9.5
  crystal_half_length_radius: 195
  crystal_half_width: 265
  half_life: 64.6

dataset_overrides:
  nema_phantom_data:
    simulation:
      photon_energy: 150
      window_lower: 75
      window_upper: 225
      collimator: "ma-mlegp"
      collimator_routine: 1
      photon_direction: 3
      crystal_thickness: 9.5
      crystal_half_length_radius: 195
      crystal_half_width: 265
  phantom_140:
    simulation:
      photon_energy: 150
      window_lower: 75

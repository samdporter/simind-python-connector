osem:
  initial_subsets: 12
  initial_epochs: 10
  smoothing: true
  resolution_model: [1.31, 0.027, false]
  gaussian_image_processor_fwhm: [6.9, 6.9, 6.9]
  relative_difference_prior:
    weight: 0.0
    gamma: null
    epsilon: null
    update_point: "post"

scatter_estimation:
  additive_mode: "update_scatter"
  median_filter_size: 0
  gaussian_sigma: 0.0
  mask_threshold: 0.05
  mask_opening_radius: 2
  mask_keep_largest_component: true
  additive_alpha: 1
  scale_method: "trimmed_mean"
  scale_trim_frac: 0.1
  scale_min_linear: 0.0
  scale_min_b02: 0.0
  save_scale_ratios: true

pipeline:
  num_iterations: 10
  num_array_jobs: 10

output:
  base_output_dir: "/home/sporter/synergistic_Y90/SIRF-SIMIND-Connection/output"
  suffix: "cluster"

sum_scatter:
  scatter_pattern: "*_iter%ITER%_*_sca_w1.hs"
  total_pattern: "*_iter%ITER%_*_tot_w1.hs"
  image_pattern: "recon_osem_i*_s*_smoothed_%PREV_ITER%.hv"

patient_processing:
  patient_data_root: "/home/sporter/synergistic_Y90/prepared_data"
  activities_csv_filename: "activities.csv"
  spect_activity_column_index: 2

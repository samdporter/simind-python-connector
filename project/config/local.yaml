# Local Testing Configuration
# Compatible with main simulation.py script

# Project paths and settings
project:
  total_activity: 358.7
  data_dir: "/home/storage/prepared_data/phantom_data/nema_phantom_data/SPECT"
  image_path: "/home/storage/prepared_data/phantom_data/nema_phantom_data/SPECT/initial_image.hv"  # Will be updated dynamically
  output_dir: "/home/sam/working/sirf_simind_connection/output/local"
  output_prefix: "output_iter1_"  # Will be updated dynamically
  simind_parent_dir: "/home/sam/working/sirf_simind_connection"
  axial_slice: 50

# Data file names (relative to data_dir)
data:
  mu_map_filename: "umap_zoomed.hv"
  measured_data_filename: "peak.hs"
  initial_additive_filename: scatter_dl.hs


# Simulation parameters
simulation:
  photon_multiplier: 1
  photon_energy: 150
  window_lower: 75
  window_upper: 225
  time_per_projection: 40
  source_type: "y90_frey"
  collimator: "ma-mlegp"
  kev_per_channel: 10
  max_energy: 2080
  scoring_routine: 1  # scattwin
  collimator_routine: 1
  photon_direction: 3
  crystal_thickness: 9.5
  crystal_half_length_radius: 195
  crystal_half_width: 265
  half_life: 64.6

# OSEM Settings (for pipeline compatibility)
osem:
  initial_subsets: 12
  initial_epochs: 5
  smoothing: true
  resolution_model: [1.31, 0.027, false]  # SPECTUBMatrix.set_resolution_model(a, b, use)
  gaussian_image_processor_fwhm: [6.9, 6.9, 6.9]  # SeparableGaussianImageFilter fwhm (x, y, z)
  relative_difference_prior:
    weight: 0.1  # >0 enables RelativeDifferencePrior
    gamma: null  # optional; leave null for STIR default
    epsilon: null  # optional; leave null for STIR default
    update_point: "post"  # "pre" uses x^k, "post" uses x^(k+1/2)

scatter_estimation:
  median_filter_size: 0  # 0/1 disables; use odd values like 3 or 5 to enable
  gaussian_sigma: 0.0  # <=0 disables; e.g. 1.0 enables Gaussian smoothing
  mask_threshold: 0.05
  mask_opening_radius: 2  # >0 helps suppress thin bed/table structures
  mask_keep_largest_component: true
  additive_alpha: 0.2  # 0 keeps old additive; 1 replaces fully
  scale_method: "trimmed_mean"  # sum | trimmed_mean
  scale_trim_frac: 0.1  # 0 disables trimming; must be < 0.5
  scale_min_linear: 10.0  # set >0 to threshold low-count bins
  scale_min_b02: 10.0  # set >0 to threshold low-count bins
  save_scale_ratios: true  # write per-bin ratio map + mask each iteration

# Pipeline Settings (for pipeline compatibility)
pipeline:
  num_iterations: 10
  num_array_jobs: 10

# Output settings (for pipeline compatibility)
output:
  base_output_dir: "/home/sam/working/sirf_simind_connection/output"
  suffix: "local"

# Sum Scatter Settings
sum_scatter:
  scatter_pattern: "*_iter%ITER%_*_sca_w1.hs"
  total_pattern: "*_iter%ITER%_*_tot_w1.hs"
  image_pattern: "recon_osem_i*_s*_smoothed_%PREV_ITER%.hv"

# Patient Processing Settings
patient_processing:
  patient_data_root: "/home/storage/prepared_data"
  activities_csv_filename: "activities.csv"
  spect_activity_column_index: 2

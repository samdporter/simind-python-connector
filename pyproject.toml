[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simind-python-connector"
dynamic = ["version"]
description = "Python SIMIND Monte Carlo connector with STIR/SIRF/PyTomography adaptors"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Sam Porter", email = "sam.porter.18@ucl.ac.uk"},
    {name = "Rebecca Gillen", email = "rebecca.gillen.18@ucl.ac.uk"},
    {name = "Efstathios (Stahis) Varzakis", email = "efstathios.varzakis.22@ucl.ac.uk"},
]
maintainers = [
    {name = "Sam Porter", email = "sam.porter.18@ucl.ac.uk"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["SPECT", "Monte Carlo", "medical imaging", "SIMIND", "SIRF", "STIR"]
dependencies = [
    "numpy>=1.20.0,<2.0",
    "pydicom>=2.0.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "pre-commit",
    "build",
    "twine",
]
examples = [
    "matplotlib>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/samdporter/simind-python-connector"
Documentation = "https://simind-python-connector.readthedocs.io/"
Repository = "https://github.com/samdporter/simind-python-connector"
Issues = "https://github.com/samdporter/simind-python-connector/issues"
Changelog = "https://github.com/samdporter/simind-python-connector/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "simind_python_connector._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["simind_python_connector*"]

[tool.setuptools.package-data]
simind_python_connector = [
    "configs/*.smc",
    "configs/*.yaml",
    "data/*.atn",
    "data/*.json",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I"]  # Include import sorting (I)

[tool.ruff.lint.isort]
# Black-compatible import sorting
force-single-line = false
lines-after-imports = 2
known-first-party = ["simind_python_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --durations=10"
markers = [
    "unit: marks tests as pure unit tests (CI-friendly)",
    "integration: marks tests as integration tests (may be slow)",
    "slow: marks tests that take significant time to run (>10 seconds)",
    "ci_skip: marks tests to skip in CI environments",
    "requires_sirf: marks tests that require SIRF to be installed",
    "requires_stir: marks tests that require STIR Python to be installed",
    "requires_simind: marks tests that require SIMIND to be installed",
    "requires_pytomography: marks tests that require PyTomography to be installed",
    "requires_cil: marks tests that require CIL to be installed",
    "requires_setr: marks tests that require SETR to be installed",
]
console_output_style = "progress"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Checked by test_run_warns_when_scattwin_runs_without_ca.
    "ignore:SCATTWIN without the CA runtime switch:UserWarning",
]
